name: animeflux
description: "Aplikasi streaming & download anime (Otakudesu, Hidoristream, Lendrive) + baca komik (Komiku, Komikstation, Kiryuu) dengan pemblokir iklan bawaan."
publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network & parsing
  dio: ^5.7.0
  html: ^0.15.4
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Video player (media_kit — support Android 6+)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.6

  # Download manager
  flutter_downloader: ^1.11.8
  permission_handler: ^11.3.1

  # WebView ber-adblock (player embed, browser download, fetch lolos Cloudflare)
  flutter_inappwebview: ^6.1.5

  # UI utilities
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  share_plus: ^10.0.0
  package_info_plus: ^8.0.2

  # Picture-in-Picture handled via native platform channel (MainActivity.kt).
  wakelock_plus: ^1.2.8

  # Misc
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.5.1
  logger: ^2.4.0
  html_unescape: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
